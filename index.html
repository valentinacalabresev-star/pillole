<html lang="it">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    :root {
      --bg:#080810; --surface:#10101e; --surface2:#18182a; --surface3:#20203a;
      --border:#ffffff12; --border2:#ffffff20;
      --text:#f0f0fa; --text2:#a0a0c0; --text3:#6060a0;
      --accent:#7c3aed; --accent2:#a78bfa; --green:#22c55e; --red:#ef4444; --yellow:#facc15;
    }
    body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif; min-height:100vh; overflow-x:hidden; padding-bottom:80px; }
    body::before { content:''; position:fixed; top:-200px; left:-200px; width:600px; height:600px; background:radial-gradient(circle,rgba(124,58,237,.12) 0%,transparent 70%); pointer-events:none; z-index:0; }

    .header { position:sticky; top:0; z-index:100; background:rgba(8,8,16,.9); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:14px 18px 0; }
    .header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .logo { display:flex; align-items:center; gap:8px; }
    .logo-icon { width:32px; height:32px; background:linear-gradient(135deg,#7c3aed,#a78bfa); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; }
    .logo-text { font-size:1.1rem; font-weight:800; background:linear-gradient(135deg,#a78bfa,#e879f9); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; letter-spacing:-.5px; }
    .header-right { display:flex; align-items:center; gap:8px; }
    .hdr-btn { display:flex; align-items:center; gap:5px; background:var(--surface2); border:1px solid var(--border2); border-radius:20px; padding:5px 12px; color:var(--text2); font-size:.78rem; cursor:pointer; transition:all .2s; }
    .hdr-btn:active { transform:scale(.95); }

    .sync-dot { width:7px; height:7px; border-radius:50%; background:var(--text3); display:inline-block; transition:background .3s; }
    .sync-dot.syncing { background:#facc15; animation:pulse .8s infinite; }
    .sync-dot.ok { background:var(--green); }
    .sync-dot.err { background:var(--red); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .filters { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:0 0 14px; }
    .filters::-webkit-scrollbar { display:none; }
    .filter-btn { flex-shrink:0; padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:transparent; color:var(--text3); font-size:.78rem; font-weight:500; cursor:pointer; transition:all .2s; white-space:nowrap; }
    .filter-btn:active { transform:scale(.95); }
    .filter-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }

    .bottom-nav { position:fixed; bottom:0; left:0; right:0; z-index:200; background:rgba(8,8,16,.95); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-top:1px solid var(--border); display:flex; }
    .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 0 14px; cursor:pointer; gap:4px; transition:color .2s; color:var(--text3); font-size:.7rem; font-weight:500; border:none; background:transparent; }
    .nav-btn .nav-icon { font-size:1.3rem; }
    .nav-btn.active { color:var(--accent2); }

    .view { display:none; padding:16px 16px 20px; max-width:680px; margin:0 auto; position:relative; z-index:1; }
    .view.active { display:block; }

    .cards-list { display:flex; flex-direction:column; gap:14px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:20px; overflow:hidden; cursor:pointer; transition:transform .15s,border-color .2s,box-shadow .2s; animation:slideUp .35s ease both; }
    @keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .card:active { transform:scale(.98); }
    .card.expanded { border-color:var(--border2); box-shadow:0 0 0 1px rgba(124,58,237,.3),0 8px 40px rgba(124,58,237,.12); }
    .card.read { opacity:.65; }
    .card-bar { height:3px; width:100%; }
    .card-inner { padding:16px 18px 14px; }
    .card-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .card-meta { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .cat-badge { font-size:.68rem; font-weight:700; padding:3px 9px; border-radius:10px; letter-spacing:.4px; text-transform:uppercase; }
    .type-badge { font-size:.68rem; color:var(--text3); background:var(--surface2); padding:3px 8px; border-radius:8px; }
    .read-badge { font-size:.65rem; color:var(--green); background:rgba(34,197,94,.12); padding:3px 8px; border-radius:8px; }
    .card-actions { display:flex; align-items:center; gap:6px; }
    .icon-btn { width:28px; height:28px; border-radius:50%; border:1px solid var(--border); background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:13px; cursor:pointer; transition:all .2s; flex-shrink:0; }
    .icon-btn.saved { background:rgba(250,204,21,.12); border-color:rgba(250,204,21,.3); }
    .icon-btn:active { transform:scale(.85); }
    .card-title { font-size:1rem; font-weight:700; line-height:1.35; margin-bottom:10px; color:var(--text); letter-spacing:-.2px; }
    .video-thumb-wrap { position:relative; width:100%; aspect-ratio:16/9; border-radius:12px; overflow:hidden; margin-bottom:12px; background:var(--surface2); }
    .video-thumb-wrap img { width:100%; height:100%; object-fit:cover; }
    .play-overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.35); }
    .play-btn { width:52px; height:52px; background:rgba(255,255,255,.95); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; box-shadow:0 4px 20px rgba(0,0,0,.4); }
    .card-preview { font-size:.875rem; color:var(--text2); line-height:1.6; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
    .card-body { display:none; font-size:.875rem; color:#c0c0e0; line-height:1.75; white-space:pre-line; }
    .card.expanded .card-preview { display:none; }
    .card.expanded .card-body { display:block; }
    .video-embed { display:none; margin-top:14px; }
    .card.expanded .video-embed { display:block; }
    .video-embed iframe { width:100%; aspect-ratio:16/9; border-radius:12px; border:none; }
    .card-fonte { display:none; margin-top:12px; padding:10px 12px; background:var(--surface2); border-radius:10px; border:1px solid var(--border); }
    .card.expanded .card-fonte { display:flex; align-items:center; gap:8px; }
    .fonte-label { font-size:.7rem; color:var(--text3); text-transform:uppercase; letter-spacing:.5px; flex-shrink:0; }
    .fonte-link { font-size:.75rem; color:var(--accent2); text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mark-read-wrap { display:none; margin-top:14px; }
    .card.expanded .mark-read-wrap { display:flex; align-items:center; justify-content:center; gap:10px; }
    .mark-read-q { font-size:.8rem; color:var(--text2); }
    .mark-read-yes { padding:6px 18px; border-radius:20px; border:none; background:linear-gradient(135deg,#22c55e,#16a34a); color:#fff; font-size:.8rem; font-weight:700; cursor:pointer; }
    .card-footer { display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding-top:12px; border-top:1px solid var(--border); }
    .read-more { font-size:.78rem; color:var(--accent2); font-weight:600; }
    .toggle-icon { width:24px; height:24px; border-radius:50%; background:var(--surface2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text2); font-size:11px; transition:transform .2s; }
    .card.expanded .toggle-icon { transform:rotate(180deg); }

    .view-title { font-size:1.2rem; font-weight:800; margin-bottom:18px; display:flex; align-items:center; gap:8px; }
    .pill-count-badge { font-size:.72rem; background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:3px 10px; color:var(--text3); font-weight:500; }

    .empty { text-align:center; padding:60px 20px; color:var(--text3); }
    .empty-icon { font-size:2.5rem; margin-bottom:12px; }
    .empty p { font-size:.9rem; line-height:1.6; }

    /* QUIZ */
    .quiz-wrap { display:flex; flex-direction:column; gap:16px; }
    .quiz-progress { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
    .quiz-bar-bg { flex:1; height:4px; background:var(--surface2); border-radius:4px; overflow:hidden; }
    .quiz-bar-fill { height:100%; background:linear-gradient(90deg,#7c3aed,#e879f9); border-radius:4px; transition:width .4s; }
    .quiz-label { font-size:.72rem; color:var(--text3); flex-shrink:0; }
    .quiz-card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:20px 18px; }
    .quiz-cat { font-size:.68rem; font-weight:700; padding:3px 9px; border-radius:10px; text-transform:uppercase; letter-spacing:.4px; display:inline-flex; margin-bottom:12px; }
    .quiz-q { font-size:1rem; font-weight:700; line-height:1.4; margin-bottom:16px; color:var(--text); }
    .quiz-options { display:flex; flex-direction:column; gap:8px; }
    .quiz-opt { padding:12px 16px; border-radius:12px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:.875rem; cursor:pointer; transition:all .2s; text-align:left; }
    .quiz-opt:active { transform:scale(.98); }
    .quiz-opt.correct { background:rgba(34,197,94,.15); border-color:rgba(34,197,94,.5); color:var(--green); font-weight:600; }
    .quiz-opt.wrong { background:rgba(239,68,68,.12); border-color:rgba(239,68,68,.4); color:var(--red); }
    .quiz-opt.reveal { background:rgba(34,197,94,.08); border-color:rgba(34,197,94,.3); color:rgba(34,197,94,.8); }
    .quiz-opt:disabled { cursor:default; }
    .quiz-explanation { display:none; margin-top:14px; padding:12px 14px; background:var(--surface2); border-radius:12px; border-left:3px solid var(--accent); font-size:.83rem; color:var(--text2); line-height:1.6; }
    .quiz-explanation.visible { display:block; }
    .quiz-next { display:none; margin-top:14px; width:100%; padding:13px; border-radius:14px; border:none; background:linear-gradient(135deg,#7c3aed,#a855f7); color:#fff; font-size:.9rem; font-weight:700; cursor:pointer; }
    .quiz-next.visible { display:block; }
    .quiz-score { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:28px 20px; text-align:center; }
    .score-emoji { font-size:3rem; margin-bottom:10px; }
    .score-title { font-size:1.3rem; font-weight:800; margin-bottom:6px; }
    .score-sub { font-size:.875rem; color:var(--text2); margin-bottom:20px; line-height:1.5; }
    .score-bar-wrap { background:var(--surface2); border-radius:20px; height:10px; overflow:hidden; margin-bottom:20px; }
    .score-bar { height:100%; border-radius:20px; background:linear-gradient(90deg,#7c3aed,#e879f9); transition:width .8s; }
    .quiz-restart { padding:13px 32px; border-radius:14px; border:none; background:linear-gradient(135deg,#7c3aed,#a855f7); color:#fff; font-size:.9rem; font-weight:700; cursor:pointer; }

    .c-marketing{background:linear-gradient(135deg,#f472b6,#ec4899)}

    .c-business{background:linear-gradient(135deg,#4ade80,#22c55e)}
    .c-scienze{background:linear-gradient(135deg,#e879f9,#d946ef)}
    .c-neuromark{background:linear-gradient(135deg,#f472b6,#a855f7)}
    .c-finanza{background:linear-gradient(135deg,#facc15,#eab308)}
    .c-digital{background:linear-gradient(135deg,#60a5fa,#3b82f6)}
    .c-storia{background:linear-gradient(135deg,#f87171,#ef4444)}
    .c-comunicaz{background:linear-gradient(135deg,#34d399,#10b981)}
    .c-performance{background:linear-gradient(135deg,#a78bfa,#8b5cf6)}

    .c-altro{background:linear-gradient(135deg,#94a3b8,#64748b)}
  </style>
</head>
<body>

<div class="header">

      <div class="logo-icon">✦</div>

    </div>

        <span class="sync-dot" id="syncDot"></span><span id="syncLabel">sync</span>
      </span>

</div>

</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────
const HIDDEN_TTL = 15 * 24 * 60 * 60 * 1000;
const SB_URL  = 'https://lrhifovtpgbeyhyadoxi.supabase.co';
const SB_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyaGlmb3Z0cGdiZXloeWFkb3hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2Nzc1NDgsImV4cCI6MjA5NDI1MzU0OH0.Ic9SwqfimRY_Tr5Ukirn7AogOxQMg8KvR7cbxguaEA0';
const SB_HEADERS = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' };

// ── CAT MAPS ─────────────────────────────────────────────────────────────
const CAT_CLASS = {
  'Marketing':'c-marketing','AI':'c-ai','Psicologia':'c-psicologia',
  'Business':'c-business','Scienze Comportamentali':'c-scienze',
  'Neuromarketing':'c-neuromark','Finanza':'c-finanza','Digital':'c-digital',
  'Storia & Geopolitica':'c-storia','Comunicazione':'c-comunicaz',
  'Performance':'c-performance','Filosofia':'c-filosofia','Arte & Design':'c-arte'
};
const CAT_COLORS = {
  'Marketing':{bg:'#f472b620',text:'#f472b6'},
  'AI':{bg:'#38bdf820',text:'#38bdf8'},
  'Psicologia':{bg:'#fb923c20',text:'#fb923c'},
  'Business':{bg:'#4ade8020',text:'#4ade80'},
  'Scienze Comportamentali':{bg:'#e879f920',text:'#e879f9'},
  'Neuromarketing':{bg:'#f472b620',text:'#f472b6'},
  'Finanza':{bg:'#facc1520',text:'#facc15'},
  'Digital':{bg:'#60a5fa20',text:'#60a5fa'},
  'Storia & Geopolitica':{bg:'#f8717120',text:'#f87171'},
  'Comunicazione':{bg:'#34d39920',text:'#34d399'},
  'Performance':{bg:'#a78bfa20',text:'#a78bfa'},
  'Filosofia':{bg:'#fbbf2420',text:'#fbbf24'},
  'Arte & Design':{bg:'#f9a8d420',text:'#ec4899'}
};
function getCatStyle(cat){ return CAT_COLORS[cat]||{bg:'#94a3b820',text:'#94a3b8'}; }
function getCatClass(cat){ return CAT_CLASS[cat]||'c-altro'; }
function formatDate(d){ const [y,m,g]=d.split('-'); const mo=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic']; return g+' '+mo[parseInt(m)-1]; }

// ── STATE ─────────────────────────────────────────────────────────────────
let stato = { saved:[], read:[], hidden:{}, quiz_wrong:{} };
// statoSha rimosso (Supabase non lo usa)
let syncTimer = null;
let dirty = false;

function setSyncDot(mode){
  const dot=document.getElementById('syncDot');
  const lbl=document.getElementById('syncLabel');
  dot.className='sync-dot '+mode;
  lbl.textContent=mode==='syncing'?'sync...':(mode==='ok'?'ok':'sync');
}

async function loadStato(){
  function showLoadInfo(source, count){
    let el = document.getElementById('load-info');
    if(!el){ el=document.createElement('div'); el.id='load-info'; el.style='position:fixed;top:60px;right:8px;background:#1a1a2e;border:1px solid #ffffff30;color:#a0a0c0;padding:4px 8px;border-radius:6px;font-size:.7rem;z-index:9999;'; document.body.appendChild(el); }
    el.textContent = source + ' · ' + count + ' righe';
    setTimeout(()=>{ if(el) el.remove(); }, 5000);
  }
  try {
    const r = await fetch(SB_URL + '/rest/v1/pillole_stato?select=id,letta,salvata,nascosta,aggiornata_il', {
      headers: SB_HEADERS
    });
    if(!r.ok) throw new Error('fetch ' + r.status);
    const rows = await r.json();
    stato = { saved:[], read:[], hidden:{}, quiz_wrong:{} };
    const now = Date.now();
    rows.forEach(row => {
      const rid = isNaN(row.id) ? row.id : Number(row.id);
      if(row.salvata) stato.saved.push(rid);
      if(row.letta)   stato.read.push(rid);
      if(row.nascosta){
        const ts = row.aggiornata_il ? new Date(row.aggiornata_il).getTime() : now;
        if(now - ts < HIDDEN_TTL) stato.hidden[rid] = ts;
      }
    });
    localStorage.setItem('p_stato', JSON.stringify(stato));
    showLoadInfo('☁️ Supabase', rows.length);
  } catch(e) {
    stato = JSON.parse(localStorage.getItem('p_stato')||'{"saved":[],"read":[],"hidden":{},"quiz_wrong":{}}');
    showLoadInfo('💾 LocalStorage (err: ' + e.message + ')', (stato.saved||[]).length + (stato.read||[]).length);
  }
}

async function sbUpsert(id, fields){
  try {
    await fetch(SB_URL + '/rest/v1/pillole_stato', {
      method: 'POST',
      headers: { ...SB_HEADERS, 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify({ id, ...fields })
    });
  } catch(e) { /* silent — localStorage è già aggiornato */ }
}

async function saveStato(){
  setSyncDot('syncing');
  localStorage.setItem('p_stato', JSON.stringify(stato));
  try {
    // Usa una mappa per deduplicare: stessa pillola non appare due volte
    const map = {};
    (stato.saved||[]).forEach(id => { const k=String(id); if(!map[k]) map[k]={salvata:false,letta:false,nascosta:false}; map[k].salvata=true; });
    (stato.read||[]).forEach(id  => { const k=String(id); if(!map[k]) map[k]={salvata:false,letta:false,nascosta:false}; map[k].letta=true; });
    Object.keys(stato.hidden||{}).forEach(id => { const k=String(id); if(!map[k]) map[k]={salvata:false,letta:false,nascosta:false}; map[k].nascosta=true; });
    const rows = Object.entries(map).map(([id, fields]) => ({
      id, ...fields, aggiornata_il: new Date().toISOString()
    }));
    if(rows.length > 0){
      const r = await fetch(SB_URL + '/rest/v1/pillole_stato', {
        method: 'POST',
        headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
        body: JSON.stringify(rows)
      });
      if(!r.ok){
        const errText = await r.text();
        throw new Error(r.status + ': ' + errText.slice(0,200));
      }
    }
    dirty = false;
    setSyncDot('ok');
    setTimeout(()=>setSyncDot(''),2000);
  } catch(e) {
    setSyncDot('err');
    let toast = document.getElementById('err-toast');
    if(!toast){ toast = document.createElement('div'); toast.id='err-toast'; toast.style='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#ef4444;color:#fff;padding:10px 16px;border-radius:10px;font-size:.8rem;z-index:9999;max-width:90vw;word-break:break-all;'; document.body.appendChild(toast); }
    toast.textContent = 'Errore sync: ' + (e && e.message ? e.message : String(e));
    setTimeout(()=>{ if(toast) toast.remove(); }, 10000);
  }
}

function scheduleSave(){
  dirty=true;
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer=setTimeout(saveStato, 1500);
}

function isSaved(id){ return stato.saved.includes(id); }
function isRead(id){ return stato.read.includes(id); }
function isHidden(id){ return id in stato.hidden; }

function toggleSave(id,btn,e){
  e.stopPropagation();
  if(isSaved(id)) stato.saved=stato.saved.filter(x=>x!==id);
  else stato.saved.push(id);
  btn.textContent=isSaved(id)?'🔖':'🤍';
  btn.classList.toggle('saved',isSaved(id));
  scheduleSave();
  updateSavedCount();
}

function markRead(id,card){
  if(!isRead(id)){ stato.read.push(id); scheduleSave(); }
  card.classList.add('read');
  const wrap=card.querySelector('.mark-read-wrap');
  if(wrap) wrap.innerHTML='<span style="font-size:.8rem;color:var(--green)">✓ Segnato come letto</span>';
  const slot=card.querySelector('.read-badge-slot');
  if(slot) slot.innerHTML='<span class="read-badge">✓ letto</span>';
}

function hideCard(id,e){
  e.stopPropagation();
  stato.hidden[id]=Date.now();
  scheduleSave();
  renderFeed(); renderHidden(); updateHiddenCount();
}

function unhideCard(id){
  delete stato.hidden[id];
  scheduleSave();
  renderHidden(); updateHiddenCount();
}

function updateSavedCount(){
  const n=stato.saved.length;
  document.getElementById('savedCount').textContent=n+' pillol'+(n===1?'a':'e');
}
function updateHiddenCount(){
  const n=Object.keys(stato.hidden).length;
  document.getElementById('hiddenCount').textContent=n+' card';
}

// ── NAVIGATION ────────────────────────────────────────────────────────────
let currentView='feed';
function switchView(v){
  currentView=v;
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.getElementById('nav-'+v).classList.add('active');
  if(v==='saved') renderSaved();
  if(v==='hidden') renderHidden();
  if(v==='quiz') startQuiz();
}

// ── BUILD CARD ─────────────────────────────────────────────────────────────
function buildCard(p,index,opts={}){
  const cs=getCatStyle(p.categoria);
  const cc=getCatClass(p.categoria);
  const isVideo=p.tipo==='video';

  const card=document.createElement('div');
  card.className='card'+(isRead(p.id)?' read':'');
  card.style.animationDelay=(index*0.04)+'s';

  const thumbHtml=isVideo&&p.video_thumb?`<div class="video-thumb-wrap"><img src="${p.video_thumb}" alt="" loading="lazy"><div class="play-overlay"><div class="play-btn">▶</div></div></div>`:'';
  const videoEmbed=isVideo&&p.video_id?`<div class="video-embed"><iframe src="https://www.youtube.com/embed/${p.video_id}?rel=0" allowfullscreen loading="lazy"></iframe></div>`:'';
  const fonteHtml=p.fonte?`<div class="card-fonte"><span class="fonte-label">📖 Fonte</span><a class="fonte-link" href="${p.fonte.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${p.fonte.nome}</a></div>`:'';
  const readLabel=isRead(p.id)?'<span class="read-badge">✓ letto</span>':'';
  const markReadHtml=isRead(p.id)
    ?'<div class="mark-read-wrap"><span style="font-size:.8rem;color:var(--green)">✓ Segnato come letto</span></div>'
    :'<div class="mark-read-wrap"><span class="mark-read-q">L\'hai letta?</span><button class="mark-read-yes">Sì, l\'ho letta ✓</button></div>';
  const actionBtn=opts.isHidden
    ?`<button class="icon-btn" title="Ripristina" onclick="unhideCard(${p.id});event.stopPropagation()">↩</button>`
    :`<button class="icon-btn" title="Nascondi" onclick="hideCard(${p.id},event)">✕</button>`;

  card.innerHTML=`
    <div class="card-bar ${cc}"></div>
    <div class="card-inner">
      <div class="card-top">
        <div class="card-meta">
          <span class="cat-badge" style="background:${cs.bg};color:${cs.text}">${p.categoria}</span>
          ${isVideo?'<span class="type-badge">▶ video</span>':''}
          <span class="read-badge-slot">${readLabel}</span>
        </div>
        <div class="card-actions">
          <button class="icon-btn ${isSaved(p.id)?'saved':''}" data-saveid="${p.id}">${isSaved(p.id)?'🔖':'🤍'}</button>
          ${actionBtn}
        </div>
      </div>
      <div class="card-title">${p.titolo}</div>
      ${thumbHtml}
      <div class="card-preview">${p.contenuto.split('\n\n')[0]}</div>
      <div class="card-body">${p.contenuto}</div>
      ${videoEmbed}
      ${fonteHtml}
      ${markReadHtml}
      <div class="card-footer">
        <span class="read-more">${isVideo?'Guarda & leggi':'Leggi tutto'}</span>
        <div class="toggle-icon">▾</div>
      </div>
    </div>`;

  card.querySelector('[data-saveid]').addEventListener('click',(e)=>toggleSave(p.id,card.querySelector('[data-saveid]'),e));
  const mrBtn=card.querySelector('.mark-read-yes');
  if(mrBtn) mrBtn.addEventListener('click',(e)=>{ e.stopPropagation(); markRead(p.id,card); });
  card.addEventListener('click',()=>{
    card.classList.toggle('expanded');
    const rm=card.querySelector('.read-more');
    rm.textContent=card.classList.contains('expanded')?'Chiudi':(isVideo?'Guarda & leggi':'Leggi tutto');
  });
  return card;
}

// ── RENDER ─────────────────────────────────────────────────────────────────
let pillole=[];
let activeFilter='tutti';

function renderFeed(){
  let filtered=pillole.filter(p=>!isHidden(p.id));
  if(activeFilter==='nonletti') filtered=filtered.filter(p=>!isRead(p.id));
  else if(activeFilter!=='tutti') filtered=filtered.filter(p=>p.categoria===activeFilter);
  const feed=document.getElementById('feed');
  if(!filtered.length){ feed.innerHTML='<div class="empty"><div class="empty-icon">🌱</div><p>Nessuna pillola qui.</p></div>'; return; }
  feed.innerHTML='';
  filtered.forEach((p,i)=>feed.appendChild(buildCard(p,i)));
}

function renderSaved(){
  const items=pillole.filter(p=>isSaved(p.id));
  const c=document.getElementById('savedFeed');
  updateSavedCount();
  if(!items.length){ c.innerHTML='<div class="empty"><div class="empty-icon">🔖</div><p>Nessuna pillola salvata.</p></div>'; return; }
  c.innerHTML=''; items.forEach((p,i)=>c.appendChild(buildCard(p,i)));
}

function renderHidden(){
  const items=pillole.filter(p=>isHidden(p.id));
  const c=document.getElementById('hiddenFeed');
  updateHiddenCount();
  if(!items.length){ c.innerHTML='<div class="empty"><div class="empty-icon">🙈</div><p>Nessuna card nascosta.</p></div>'; return; }
  c.innerHTML=''; items.forEach((p,i)=>c.appendChild(buildCard(p,i,{isHidden:true})));
}

function buildFilters(){
  const cats=[...new Set(pillole.map(p=>p.categoria))];
  const container=document.getElementById('filters');
  cats.forEach(cat=>{
    const btn=document.createElement('button');
    btn.className='filter-btn'; btn.dataset.cat=cat; btn.textContent=cat;
    btn.onclick=()=>setFilter(cat);
    container.appendChild(btn);
  });
}

function setFilter(cat){
  activeFilter=cat;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));
  renderFeed();
}
</script>

<script>
// ── QUIZ ────────────────────────────────────────────────────────────────
const QUIZ_BANK = [
  { cat:'Marketing', q:'Nell\'esperimento delle marmellate di Schwartz, quale bancarella vendeva di più?', opts:['Quella con 24 gusti','Quella con 6 gusti','Entrambe uguale','Non è stato misurato'], correct:1, exp:'La bancarella con 6 gusti vendeva 10 volte di più. Più opzioni = più paralisi decisionale.' },
  { cat:'Marketing', q:'Cos\'è la "CTA" in una campagna marketing?', opts:['Call To Action — la richiesta esplicita di fare qualcosa','Cost To Acquire — il costo di acquisizione cliente','Creative Template Asset','Content Traffic Analytics'], correct:0, exp:'CTA = Call To Action. È il punto di conversione: "Acquista", "Iscriviti", "Scopri di più".' },
  { cat:'Psicologia', q:'Secondo il modello Dunning-Kruger, chi tende a sovrastimare le proprie capacità?', opts:['Chi ha molta esperienza','Chi ha poca esperienza','Chi ha un QI elevato','Chi ha un QI basso'], correct:1, exp:'Chi ha poca competenza non ha ancora sviluppato la capacità di riconoscere i propri errori.' },
  { cat:'Business', q:'Cosa intende Warren Buffett con il termine "moat"?', opts:['Il fatturato annuo dell\'azienda','Il vantaggio competitivo che protegge l\'azienda dai competitor','La strategia di pricing','Il piano di espansione internazionale'], correct:1, exp:'Moat = fossato. È ciò che rende difficile per i competitor replicare il modello di business.' },
  { cat:'AI', q:'Cosa distingue un agente AI da un modello come ChatGPT classico?', opts:['È più intelligente','Può agire in autonomia verso un obiettivo usando strumenti','Ha più parametri','Consuma meno energia'], correct:1, exp:'Un agente AI non solo risponde — pianifica, usa tool (email, web, API) e porta a termine compiti da solo.' },
  { cat:'Scienze Comportamentali', q:'Il bias di conferma ci porta a fare cosa?', opts:['Cercare informazioni che contraddicono le nostre credenze','Ignorare le informazioni','Cercare informazioni che confermano ciò che già crediamo','Valutare ogni dato in modo neutro'], correct:2, exp:'Il bias di conferma è un filtro evolutivo: cerchiamo conferme, ignoriamo le smentite.' },
  { cat:'Neuromarketing', q:'Perché i prezzi che finiscono in .99 funzionano sul cervello?', opts:['Perché sembrano più economici grazie al left-digit anchoring','Perché i clienti fanno meglio i conti','Perché il 9 è un numero fortunato','Perché le aziende risparmiano'], correct:0, exp:'Il cervello legge da sinistra: 9,99 viene codificato come "vicino a 9", non a 10. Left-digit anchoring.' },
  { cat:'Finanza', q:'Se investi €1.000 al 7% annuo con interesse composto, dopo 30 anni quanto hai circa?', opts:['€2.100','€3.100','€7.600','€15.000'], correct:2, exp:'€1.000 × (1+0.07)^30 ≈ €7.612. L\'interesse composto crea crescita esponenziale nel tempo.' },
  { cat:'Digital', q:'Cosa sono i "first-party data"?', opts:['Dati comprati da liste esterne','Dati raccolti direttamente dall\'azienda attraverso le proprie interazioni','Dati forniti da Google','Dati demografici pubblici'], correct:1, exp:'First-party = dati tuoi: email, acquisti, comportamento sul sito. Sono l\'asset più prezioso nel marketing post-cookie.' },
  { cat:'Storia & Geopolitica', q:'Perché Taiwan è così strategica geopoliticamente?', opts:['Per le sue riserve petrolifere','Perché produce oltre il 90% dei chip avanzati del mondo (TSMC)','Per la sua posizione militare nel Pacifico','Per i suoi accordi commerciali con l\'Europa'], correct:1, exp:'TSMC produce i chip più avanzati del pianeta. Chi controlla Taiwan controlla l\'economia digitale globale.' },
  { cat:'Comunicazione', q:'Secondo Mehrabian, in un messaggio emotivo contraddittorio quanto contano le parole?', opts:['55%','38%','7%','50%'], correct:2, exp:'7% parole, 38% tono di voce, 55% linguaggio del corpo. Il come conta più del cosa.' },
  { cat:'Performance', q:'Quanto dura circa la finestra ottimale di lavoro profondo secondo i cicli ultradian?', opts:['30 minuti','45 minuti','90-120 minuti','4-5 ore'], correct:2, exp:'I cicli ultradian durano 90-120 minuti. Poi il cervello ha bisogno di recupero vero.' },
  { cat:'Filosofia', q:'Qual è il principio centrale dello stoicismo secondo Epitteto?', opts:['Tutto è casuale e non controllabile','Bisogna controllare le emozioni completamente','Distinguere ciò che dipende da noi da ciò che non dipende','La felicità si trova nel piacere fisico'], correct:2, exp:'La dicotomia del controllo: energia solo su ciò che puoi influenzare.' },
  { cat:'Arte & Design', q:'A chi si è ispirato Jony Ive (Apple) per il design minimalista?', opts:['Leonardo da Vinci','Dieter Rams','Steve Jobs','Il Bauhaus'], correct:1, exp:'Dieter Rams e i suoi 10 principi del buon design, tra cui: "meno design possibile".' },
  { cat:'Marketing', q:'Cos\'è il "Golden Circle" di Simon Sinek?', opts:['Una tecnica di pricing','Un modello di comunicazione basato su Why-How-What','Un framework per il branding visivo','Una strategia di content marketing'], correct:1, exp:'I grandi brand iniziano dal Perché (Why), poi il Come (How), poi il Cosa (What).' }
];

const PROF_CATS = ['Marketing','AI','Business','Scienze Comportamentali','Neuromarketing','Finanza','Digital'];
const CULT_CATS = ['Psicologia','Storia & Geopolitica','Comunicazione','Performance','Filosofia','Arte & Design'];

let quizQueue=[], quizIndex=0, quizScore=0, quizAnswered=false;

function buildQuizQueue(){
  const shuffled=[...QUIZ_BANK].sort(()=>Math.random()-.5);
  const prof=shuffled.filter(q=>PROF_CATS.includes(q.cat));
  const cult=shuffled.filter(q=>CULT_CATS.includes(q.cat));
  const queue=[];
  let pi=0,ci=0;
  while(queue.length<10){
    if(queue.length%5<3 && pi<prof.length) queue.push(prof[pi++]);
    else if(ci<cult.length) queue.push(cult[ci++]);
    else if(pi<prof.length) queue.push(prof[pi++]);
    else break;
  }
  return queue;
}

function startQuiz(){ quizQueue=buildQuizQueue(); quizIndex=0; quizScore=0; renderQuizQuestion(); }

function renderQuizQuestion(){
  const wrap=document.getElementById('quizWrap');
  if(quizIndex>=quizQueue.length){ renderQuizScore(); return; }
  const q=quizQueue[quizIndex];
  const cs=getCatStyle(q.cat);
  const pct=Math.round((quizIndex/quizQueue.length)*100);
  wrap.innerHTML=`
    <div class="quiz-progress"><div class="quiz-bar-bg"><div class="quiz-bar-fill" style="width:${pct}%"></div></div><span class="quiz-label">${quizIndex+1}/${quizQueue.length}</span></div>
    <div class="quiz-card">
      <div class="quiz-cat" style="background:${cs.bg};color:${cs.text};-webkit-text-fill-color:${cs.text}">${q.cat}</div>
      <div class="quiz-q">${q.q}</div>
      <div class="quiz-options">${q.opts.map((o,i)=>`<button class="quiz-opt" data-idx="${i}">${o}</button>`).join('')}</div>
      <div class="quiz-explanation" id="quizExp">${q.exp}</div>
      <button class="quiz-next" id="quizNext" onclick="nextQuestion()">Prossima →</button>
    </div>`;
  quizAnswered=false;
  wrap.querySelectorAll('.quiz-opt').forEach(btn=>btn.addEventListener('click',()=>answerQuiz(parseInt(btn.dataset.idx),q)));
}

function answerQuiz(chosen,q){
  if(quizAnswered) return;
  quizAnswered=true;
  const btns=document.querySelectorAll('.quiz-opt');
  btns.forEach(b=>b.disabled=true);
  if(chosen===q.correct){ btns[chosen].classList.add('correct'); quizScore++; }
  else {
    btns[chosen].classList.add('wrong');
    btns[q.correct].classList.add('reveal');
    stato.quiz_wrong[q.cat]=(stato.quiz_wrong[q.cat]||0)+1;
    scheduleSave();
  }
  document.getElementById('quizExp').classList.add('visible');
  document.getElementById('quizNext').classList.add('visible');
}

function nextQuestion(){ quizIndex++; renderQuizQuestion(); }

function renderQuizScore(){
  const pct=Math.round((quizScore/quizQueue.length)*100);
  let emoji='🌱',title='Continua così!',sub='Ogni risposta sbagliata è un\'opportunità. Riprova!';
  if(pct>=90){emoji='🏆';title='Fantastico!';sub='Hai padronanza di tutti gli argomenti.';}
  else if(pct>=70){emoji='🎯';title='Molto bene!';sub='Solida preparazione. Qualche pillola in più e sei al top.';}
  else if(pct>=50){emoji='📈';title='Stai crescendo!';sub='Rileggi le pillole degli argomenti dove hai sbagliato.';}
  const weakCats=Object.entries(stato.quiz_wrong).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]);
  const weakHint=weakCats.length?`<p style="font-size:.78rem;color:var(--text3);margin-top:8px;">💡 Da ripassare: ${weakCats.join(', ')}</p>`:'';
  document.getElementById('quizWrap').innerHTML=`
    <div class="quiz-score">
      <div class="score-emoji">${emoji}</div>
      <div class="score-title">${quizScore}/${quizQueue.length} — ${pct}%</div>
      <div class="score-sub">${sub}</div>
      <div class="score-bar-wrap"><div class="score-bar" style="width:${pct}%"></div></div>
      ${weakHint}
      <button class="quiz-restart" onclick="startQuiz()">Nuovo quiz 🔄</button>
    </div>`;
}

// ── INIT ────────────────────────────────────────────────────────────────
async function init(){
  setSyncDot('syncing');
  await loadStato();
  setSyncDot('ok');
  setTimeout(()=>setSyncDot(''),2000);

  const res=await fetch('pillole.json?v='+Date.now());
  pillole=await res.json();
  pillole.sort((a,b)=>b.id-a.id);

  // prune hidden
  const now=Date.now();
  let pruned=false;
  Object.keys(stato.hidden).forEach(id=>{ if(now-stato.hidden[id]>HIDDEN_TTL){ delete stato.hidden[id]; pruned=true; } });
  if(pruned) scheduleSave();

  buildFilters();
  renderFeed();
  updateSavedCount();
  updateHiddenCount();
}

init();
</script>
